name: Production health and recovery
on:
  workflow_dispatch:
    inputs:
      backup:
        description: Create and verify an encrypted backup
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
    - cron: '47 20 * * *'
permissions:
  contents: read
concurrency:
  group: production-operations
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: https://parivaar-call.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OPS_DATABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/operations/monitor.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-health-${{ github.run_id }}
          path: reports/health-latest.json
          retention-days: 14
  recovery:
    if: github.event.schedule == '47 20 * * *' || inputs.backup == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-recovery-check
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OPS_DATABASE_SERVICE_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.OPS_BACKUP_ENCRYPTION_KEY }}
      OPS_RECOVERY_CONFIGURATION: ${{ secrets.OPS_RECOVERY_CONFIGURATION }}
      BACKUP_DIR: backups
      RECOVERY_DATABASE_URL: postgresql://postgres:isolated-recovery-check@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/operations/backup.mjs create
      - name: Restore every value into isolated PostgreSQL
        run: node scripts/operations/backup.mjs verify backups/*.encrypted.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: encrypted-recovery-${{ github.run_id }}
          path: backups/*.encrypted.json
          retention-days: 30
          if-no-files-found: error
